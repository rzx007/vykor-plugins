name: Validate and publish marketplace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install retrieval test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          MARKET_BUILD_COMMIT: ${{ github.sha }}
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: verified-marketplace
          path: dist/
          include-hidden-files: true
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-marketplace
          path: dist
      - run: npm run verify
      - run: npm run check:publish
      - run: npm run publish:market
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mkdir public && cp dist/marketplace.json dist/index.html dist/.nojekyll public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
